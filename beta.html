    <button class="bell" id="bell" aria-label="お知らせ"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><b id="bellN"></b></button>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function(){
'use strict';
/* ===== 設定（キーやトークンはここに書かない） ===== */
var GAS_URL='https://script.google.com/macros/s/AKfycbwhmZQHIQHoohEfH0tDXuXrx-cRX7x25vFYKqJvlJqbWxUijpmEUoMPNCBy3Stc_xoD/exec';
var LIFF_ID='2011196111-mkgGx8sO';
var TK='machiyori_token';

var ph=document.getElementById('ph'),scr=document.getElementById('scr'),nav=document.getElementById('nav'),pane=document.getElementById('pane'),sheet=document.getElementById('sheet'),lg=document.getElementById('lg');
var TOKEN='',ME=null,HOME=null,tab='home',pollT=null,chatT=null;
try{TOKEN=localStorage.getItem(TK)||'';}catch(e){}

/* ===== 共通 ===== */
function esc(t){var d=document.createElement('div');d.textContent=t==null?'':String(t);return d.innerHTML;}
function $(id){return document.getElementById(id);}
function each(sel,root,fn){Array.prototype.forEach.call((root||document).querySelectorAll(sel),fn);}
function toast(t){var x=$('toast');x.textContent=t;x.classList.add('on');clearTimeout(x._t);x._t=setTimeout(function(){x.classList.remove('on');},2600);}
function md(iso){var d=new Date(iso);return isNaN(d)?'':(d.getMonth()+1)+'/'+d.getDate();}
function mdhm(iso){var d=new Date(iso);if(isNaN(d))return '';return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+('0'+d.getMinutes()).slice(-2);}
function yen(n){return Number(n||0).toLocaleString()+'円';}
function api(a,data){
  var b=data||{};b.a=a;b.token=TOKEN;
  return fetch(GAS_URL,{method:'POST',body:JSON.stringify(b)}).then(function(r){return r.json();}).then(function(j){
    if(!j.ok&&j.error==='auth'){logoutLocal();throw new Error('ログインし直してください');}
    if(!j.ok)throw new Error(j.error||'うまくいきませんでした');
    return j;
  });
}
function fail(e){toast((e&&e.message)||'通信に失敗しました。電波のよいところでもう一度お試しください');}
function openSheet(html){sheet.innerHTML='<div class="grab"></div>'+html;ph.classList.add('open');}
function closeSheet(){ph.classList.remove('open');ph.scrollTop=0;}
$('shade').onclick=closeSheet;
function setPane(html,onBack){stopChat();pane.innerHTML=html;pane.classList.add('on');var b=pane.querySelector('.bk');if(b)b.onclick=onBack||closePane;}
function closePane(){stopChat();pane.classList.remove('on');refresh();}
/* 写真を小さくしてから送る（長い辺1200px） */
function shrink(file){return new Promise(function(ok,ng){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82));};im.onerror=ng;im.src=r.result;};r.onerror=ng;r.readAsDataURL(file);});}
function charaName(){return ME&&ME.chara==='bro'?'大工のお兄さん':'建築士のお姉さん';}
function charaImg(cls){return ME&&ME.chara==='bro'?'<span class="cf-av '+(cls||'')+'">大</span>':'<img class="'+(cls||'av2')+'" src="chara.png" alt="">';}

/* ===== ログイン ===== */
function logoutLocal(){TOKEN='';ME=null;try{localStorage.removeItem(TK);}catch(e){}stopPoll();showLogin();}
function saveLogin(j){TOKEN=j.token;ME=j.user;try{localStorage.setItem(TK,TOKEN);}catch(e){}lg.hidden=true;if(history.replaceState)history.replaceState(null,'',location.pathname);afterLogin();}
function showLogin(mode){
  lg.hidden=false;mode=mode||'login';
  lg.innerHTML='<h1>まち頼</h1><p class="lgs">暮らしのそばに、頼れる地元のプロがいる</p><img class="lgc" src="chara.png" alt="">'+
    '<div class="lgbox"><button type="button" class="btn-line" id="lgLine">LINEでログイン <small>おすすめ</small></button>'+
    '<div class="or">または メールアドレスで</div>'+
    '<div class="tabs2"><button type="button" data-m="login" aria-pressed="'+(mode==='login')+'">ログイン</button><button type="button" data-m="new" aria-pressed="'+(mode==='new')+'">はじめての方</button></div>'+
    '<form class="fm" id="lgF" novalidate><label for="lgE">メールアドレス</label><input id="lgE" type="email" autocomplete="email" inputmode="email">'+
    '<label for="lgP">パスワード'+(mode==='new'?'（8文字以上）':'')+'</label><input id="lgP" type="password" autocomplete="'+(mode==='new'?'new-password':'current-password')+'">'+
    '<p class="err" id="lgErr" hidden></p><button class="big" type="submit">'+(mode==='new'?'登録して始める':'ログイン')+'</button></form>'+
    (mode==='login'?'<button type="button" class="lnk2" id="lgFg">パスワードを忘れた方</button>':'')+'</div>'+
    '<p class="note2">一度ログインすると、次からはそのまま使えます。<br>これはテスト版です。登録した内容は、本番の前に消すことがあります。</p>';
  $('lgLine').onclick=lineLogin;
  each('.tabs2 button',lg,function(b){b.onclick=function(){showLogin(b.dataset.m);};});
  $('lgF').onsubmit=function(e){e.preventDefault();var er=$('lgErr');er.hidden=true;var bt=this.querySelector('.big');bt.disabled=true;
    api(mode==='new'?'registerEmail':'loginEmail',{email:$('lgE').value,password:$('lgP').value}).then(saveLogin).catch(function(x){er.textContent=x.message;er.hidden=false;}).then(function(){bt.disabled=false;});};
  var fg=$('lgFg');if(fg)fg.onclick=forgot;
}
function forgot(){
  lg.innerHTML='<h1>まち頼</h1><p class="lgs">パスワードの再設定</p><div class="lgbox"><form class="fm" id="fgF" novalidate><label for="fgE">登録したメールアドレス</label><input id="fgE" type="email" autocomplete="email"><button class="big" type="submit">再設定のメールを送る</button></form><button type="button" class="lnk2" id="fgB">ログイン画面にもどる</button></div>';
  $('fgB').onclick=function(){showLogin();};
  $('fgF').onsubmit=function(e){e.preventDefault();api('resetRequest',{email:$('fgE').value}).then(function(){lg.querySelector('.lgbox').innerHTML='<p style="font-size:14px">登録があれば、再設定のメールを送りました。メールのリンクを1時間以内に開いてください。<br><small style="color:#6E7D75">届かないときは、迷惑メールのフォルダも見てください。</small></p><button type="button" class="lnk2" id="fgB2">ログイン画面にもどる</button>';$('fgB2').onclick=function(){showLogin();};}).catch(fail);};
}
function resetForm(rt){
  lg.hidden=false;
  lg.innerHTML='<h1>まち頼</h1><p class="lgs">新しいパスワードを決める</p><div class="lgbox"><form class="fm" id="rsF" novalidate><label for="rsP">新しいパスワード（8文字以上）</label><input id="rsP" type="password" autocomplete="new-password"><p class="err" id="rsE" hidden></p><button class="big" type="submit">保存してログイン</button></form></div>';
  $('rsF').onsubmit=function(e){e.preventDefault();api('resetDo',{resetToken:rt,password:$('rsP').value}).then(saveLogin).catch(function(x){$('rsE').textContent=x.message;$('rsE').hidden=false;});};
}
function liffReady(){if(!window.liff)return Promise.reject(new Error('LINEの読み込みに失敗しました'));return liff.init({liffId:LIFF_ID});}
function lineLogin(){
  liffReady().then(function(){
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.origin+location.pathname});return;}
    finishLine();
  }).catch(function(e){toast('LINEログインを開始できませんでした（'+(e&&e.message||'')+'）');});
}
function finishLine(){
  var idt=null;try{idt=liff.getIDToken();}catch(e){}
  return api('loginLine',idt?{idToken:idt}:{accessToken:liff.getAccessToken()}).then(saveLogin).catch(function(e){fail(e);showLogin();});
}

/* ===== 起動 ===== */
function boot(){
  var q=new URLSearchParams(location.search);
  if(q.get('reset')){resetForm(q.get('reset'));return;}
  if(q.get('liffClientId')||q.get('code')||q.get('liff.state')){liffReady().then(function(){if(liff.isLoggedIn())finishLine();else showLogin();}).catch(function(){showLogin();});return;}
  if(!TOKEN){showLogin();return;}
  api('me').then(function(j){ME=j.user;afterLogin();}).catch(function(e){if(TOKEN)fail(e);if(!TOKEN)showLogin();});
}
function afterLogin(){
  lg.hidden=true;
  if(!ME.callName||!ME.area){welcome();}
  renderNav();refresh();startPoll();
}
function welcome(){
  openSheet('<h3>はじめまして</h3><p class="sp s2">最初に3つだけ教えてください。あとからマイページで変えられます。</p><form class="fm" id="wcF">'+
    '<label for="wcN">呼ばれたい名前</label><input id="wcN" value="'+esc(ME.callName||ME.name||'')+'" maxlength="20" placeholder="例：まさ">'+
    '<label for="wcA">お住まいの市町村</label>'+areaSel('wcA',ME.area)+
    '<label>話し相手のキャラクター</label><div class="chsel"><button type="button" data-c="sis" class="on"><img src="chara.png" alt="">建築士のお姉さん</button><button type="button" data-c="bro"><span class="cf">大</span>大工のお兄さん</button></div>'+
    '<button class="big" type="submit">始める</button></form>');
  var ch='sis';each('.chsel button',sheet,function(b){b.onclick=function(){ch=b.dataset.c;each('.chsel button',sheet,function(x){x.classList.toggle('on',x===b);});};});
  $('wcF').onsubmit=function(e){e.preventDefault();var n=$('wcN').value.trim();if(!n){$('wcN').focus();return;}
    api('saveProfile',{callName:n,area:$('wcA').value,chara:ch}).then(function(j){ME=j.user;closeSheet();refresh();}).catch(fail);};
}
var AREAS=['松本市','塩尻市','安曇野市','大町市','東筑摩郡山形村','東筑摩郡朝日村','東筑摩郡筑北村','東筑摩郡麻績村','東筑摩郡生坂村','北安曇郡池田町','北安曇郡松川村','北安曇郡白馬村','木曽郡','そのほか'];
function areaSel(id,cur){return '<select id="'+id+'">'+AREAS.map(function(a){return '<option'+(a===cur?' selected':'')+'>'+a+'</option>';}).join('')+'</select>';}

/* ===== 下のメニュー ===== */
var I={home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',list:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/>',me:'<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>'};
var NAV=[['home','ホーム'],['list','依頼'],['chat','チャット'],['me','マイページ']];

var VST={chat:['やり取り中',''],prop:['現地調査の提案あり','hot'],fixd:['調査日が決定',''],est:['確定見積もり到着','hot'],won:['依頼しました','ok'],done:['完了','ok'],lost:['見送り','off'],other:['見送り','off'],declined:['辞退','off']};
function caseStage(c,bids){if(c.status==='done')return 6;if(bids.some(function(v){return v.state==='won';}))return 5;if(bids.some(function(v){return v.state==='est';}))return 4;if(bids.some(function(v){return v.state==='fixd'||v.state==='prop';}))return 3;if(bids.length)return 2;return 1;}
function caseLine(x){var c=x.c,b=x.bids,t,m;
  if(c.status==='withdrawn'){t='取り下げ';m='';}
  else if(c.status==='postponed'){t='先送り中';m='再開予定 '+mdhm(c.postponeAt);}
  else if(c.status==='done'){t='完了';m=(b.filter(function(v){return v.state==='done';})[0]||{vendor:{}}).vendor.name||'';}
  else if(!b.length){t='返事を待っています';m='投稿 '+md(c.createdAt);}
  else{var w=b.filter(function(v){return v.state==='won';})[0];
    if(w){t='工事予定';m=(w.vendor||{}).name||'';}
    else{var hot=b.some(function(v){return v.state==='est'||v.state==='prop';});t=hot?'やることがあります':'やり取り中';m='業者'+b.filter(function(v){return VST[v.state]&&VST[v.state][1]!=='off';}).length+'社とやり取り中';}}
  return '<button type="button" class="card bp" data-c="'+c.id+'"><span class="tag"'+(c.status==='done'||c.status==='withdrawn'?' style="background:#e6eae8;color:var(--sb)"':'')+'>'+t+'</span><b>'+esc(c.title)+'</b><span class="meta"><span>'+esc(m)+'</span></span></button>';}
function bindCases(root){each('[data-c]',root,function(b){b.onclick=function(){openCase(b.dataset.c);};});}
function activeCases(){return HOME.cases.filter(function(x){return ['open','postponed','contracted'].indexOf(x.c.status)>=0;});}

var C={first:true,opening:'',busy:false};
function conc(op,firstText){
  C={first:true,opening:op,busy:false};

function cSay(t,me){var box=$('cl');if(!box)return;var d=document.createElement('div');d.className='mg'+(me?' me':' ai2');d.innerHTML=(me?'':charaImg())+'<div class="bb">'+esc(t).replace(/\n/g,'<br>')+'</div>';box.appendChild(d);box.scrollTop=box.scrollHeight;}

  var data={text:v};if(C.first){data.reset=true;data.opening=C.opening;C.first=false;}
  api('concierge',data).then(function(j){w.remove();cSay(j.reply,0);if(j.sheet)sheetCard(j.sheet);}).catch(function(e){w.remove();cSay('ごめんなさい、うまく聞き取れませんでした。もう一度送ってもらえますか？',0);fail(e);}).then(function(){C.busy=false;});

function drawCase(){
  var c=CUR.c,bs=CUR.bids,st=caseStage(c,bs),steps=['投稿','立候補','やり取り','現地調査','見積もり','依頼','完了'];
  var todo='',live=bs.filter(function(v){return VST[v.state]&&VST[v.state][1]!=='off';});
  var w=bs.filter(function(v){return v.state==='won';})[0],dn=bs.filter(function(v){return v.state==='done';})[0];
  if(c.status==='withdrawn')todo='<div class="todo1 inf"><b>取り下げました</b>この依頼は終了しています。</div>';
  else if(c.status==='postponed')todo='<div class="todo1 pp"><b>先送り中</b>再開予定 '+mdhm(c.postponeAt)+'<div class="t1b"><button type="button" id="chgB">日時を変更</button><button type="button" id="nowB">今すぐ再開</button></div></div>';

  else if(dn)todo='<div class="todo1 okk"><b>完了しました</b>口コミありがとうございました。<small class="t1n">'+esc(dn.vendor.name)+'とのチャットは、完了から30日間使えます</small></div>';
  else if(w){var lt=w.last&&w.last.type,und=w.last&&!(w.last.body||{}).done;

    else if(p1)todo='<button type="button" class="todo1" data-v="'+p1.id+'"><b>やること</b>'+esc(p1.vendor.name)+'から現地調査の提案が届いています。日時を選んでください ›</button>';

  var lastTxt=function(v){var l=v.last;if(!l)return '';var t=l.type;return t==='text'?(l.body.text||''):t==='img'?'写真':t==='sys'?l.body.text:t==='prop'?'現地調査の提案が届きました':t==='est'?'確定見積もりが届きました':t==='chg'?'金額変更の申請が届きました':t==='rep'?'完了報告が届きました':t==='visit'?'現地調査はいかがでしたか？':'';};

  var rows=SK.map(function(k){return c[k[0]]?'<div class="sht-r"><span>'+k[1]+'</span><b>'+esc(c[k[0]])+'</b></div>':'';}).join('')+(c.estOnly?'<div class="sht-r"><span>希望</span><b>見積もりだけ欲しい</b></div>':'');

var QT=['業者とのトラブル','業者から返事がない・対応してくれない','お金・キャンセルについて','アプリの使い方','機能改善の要望','登録・退会について','その他'];
function inquiry(){
  setPane('<div class="ph2"><button type="button" class="bk" aria-label="もどる">‹</button><div class="pt"><b>運営への問い合わせ</b><span>まち頼 運営事務局</span></div></div><div class="arw"><form class="pf pf2" id="qf" novalidate><div class="lab">お問い合わせの種類 <em class="rq">必須</em></div><div class="qty">'+QT.map(function(t){return '<label class="rd2"><input type="radio" name="qt" value="'+t+'">'+t+'</label>';}).join('')+'</div><label>内容 <em class="rq">必須</em><textarea id="qb" rows="6" placeholder="どの依頼のことか、何があったかを書いてください"></textarea></label><p class="warn" id="qw" hidden>種類を選び、内容を書いてください</p><button class="big" type="submit">送信する</button><p class="pc-n">1営業日以内に、アプリ内（この画面の「これまでの問い合わせ」）でご返信します。</p></form><div id="qh"></div></div>');
  api('inquiries').then(function(j){var h=$('qh');if(!h||!j.items.length)return;h.innerHTML='<div class="sec">これまでの問い合わせ</div><div class="list">'+j.items.map(function(q){return '<div class="card"><span class="tag" style="'+(q.reply?'':'background:#e6eae8;color:var(--sb)')+'">'+(q.reply?'返信あり':'確認中')+'</span><b>'+esc(q.type)+'</b><span class="meta"><span>'+esc(q.body)+'</span></span>'+(q.reply?'<div class="qrep"><b>運営より</b>'+esc(q.reply)+'</div>':'')+'</div>';}).join('')+'</div>';}).catch(function(){});
  $('qf').onsubmit=function(e){e.preventDefault();var r=document.querySelector('input[name=qt]:checked'),b=$('qb').value.trim();if(!r||!b){$('qw').hidden=false;return;}
    api('inquiry',{type:r.value,body:b}).then(function(){toast('送信しました');inquiry();}).catch(fail);};
}
$('qaBtn').onclick=inquiry;

boot();
})();
</script>
</body>
</html>
