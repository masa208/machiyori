var PP_FULL="<p>まち頼は、依頼者と業者から預かる個人情報を、マッチングと安全な取引のためだけに使います。</p><h4>1. 運営者と対象</h4><ul><li>運営者：soft keys（代表者：滝澤雅大）／長野県松本市大字里山辺3949-1 グランデュール出井3 202</li><li>対象：依頼者（相談・依頼をする方）と業者（立候補して仕事を受ける方）の両方</li></ul><h4>2. 取得する情報</h4><table><tr><th>だれの</th><th>情報</th><th>どこで受け取るか</th></tr><tr><td>共通</td><td>LINEのユーザーID・表示名、またはメールアドレスとパスワード（元に戻せない形に変えて保存）</td><td>ログイン</td></tr><tr><td>共通</td><td>チャットの内容、送った写真、口コミ、お問い合わせ</td><td>アプリの利用</td></tr><tr><td>依頼者</td><td>呼ばれたい名前、地域（市町村）、お名前・住所・電話番号（現地調査の日が決まったとき）</td><td>登録・現地調査の日程</td></tr><tr><td>依頼者</td><td>AIとの相談内容、依頼の内容</td><td>相談・依頼</td></tr><tr><td>業者</td><td>事業者名、所在地、担当者名とふりがな、電話番号、メール、HP、Googleの口コミのURL</td><td>業者登録</td></tr><tr><td>業者</td><td>本人確認書類、履歴事項全部証明書（法人）、法人番号、資格・許可の証明書、保険の加入状況、インボイスの登録番号</td><td>業者登録</td></tr><tr><td>業者</td><td>会社情報（写真・自己紹介・実績など）、対応サービスとエリア、営業日</td><td>業者登録・マイページ</td></tr></table><p>クレジットカードの番号は、まち頼では受け取りません。業者が決済会社（Stripe）の画面で直接入力します。</p><h4>3. 利用目的</h4><ol><li>依頼を、分野とエリアの合う業者に届けるため</li><li>依頼者と業者のチャット、現地調査、見積もり、完了までのやり取りを進めるため</li><li>AIが相談に答え、依頼の内容をまとめるため</li><li>業者の本人確認、資格・許可の確認のため</li><li>立候補料・紹介手数料の請求のため</li><li>お知らせ、返信の期限などの通知のため（LINE・メール・アプリ内）</li><li>規約違反（中抜きなど）を防ぐこと、トラブルやお問い合わせに対応するため</li><li>個人が分からない形にまとめて、サービスをよくするため</li></ol><h4>4. 第三者への提供（依頼者と業者のあいだ）</h4><p>まち頼は、本人の同意なく第三者に個人情報を渡しません。ただし、サービスの仕組みとして次のタイミングで相手に表示します。</p><table><tr><th>タイミング</th><th>相手に見えるもの</th></tr><tr><td>依頼を出したとき</td><td>依頼の内容、市町村まで（くわしい住所・名前・電話番号は見えません）</td></tr><tr><td>業者が立候補したとき</td><td>業者の会社名・自己紹介・実績・拠点の市町村・口コミ・写真</td></tr><tr><td>現地調査の日が決まったとき</td><td>依頼者のお名前・住所・電話番号を、その業者だけに表示</td></tr><tr><td>成約したとき</td><td>業者の電話番号・メール・HP・Googleの口コミを、その依頼者だけに表示</td></tr></table><p>次の場合は、同意なく提供することがあります。</p><ul><li>法律にもとづく場合（警察・裁判所などからの正式な求め）</li><li>人の命・体・財産を守るために必要で、本人の同意を得るのが難しい場合</li></ul><h4>5. 使っている外部サービスと外国への移転</h4><table><tr><th>サービス</th><th>使いみち</th><th>置き場所</th></tr><tr><td>Google（スプレッドシート・ドライブ・Apps Script）</td><td>データの保管、アプリの処理</td><td>日本国外を含む（場所は選べません）</td></tr><tr><td>LINE</td><td>ログイン、通知</td><td>日本など</td></tr><tr><td>OpenAI</td><td>AIの相談への返答</td><td>アメリカ</td></tr><tr><td>Stripe</td><td>カード決済</td><td>アメリカなど</td></tr><tr><td>GitHub</td><td>アプリの画面の公開（個人情報は置きません）</td><td>アメリカ</td></tr></table><ul><li>AIに送る前に、電話番号・メールアドレス・番地などは「XX」に置き換えます。</li><li>OpenAIは、APIで送られた内容をAIの学習に使わない方針です。</li></ul><h4>6. 保管期間と削除</h4><table><tr><th>情報</th><th>保管期間</th></tr><tr><td>本人確認書類の画像</td><td>確認が終わったら削除（確認した結果だけを残します）</td></tr><tr><td>チャット・依頼の記録</td><td>依頼が終わってから5年</td></tr><tr><td>お支払いの記録</td><td>法律で決められた期間</td></tr><tr><td>その他の登録情報</td><td>退会するまで</td></tr></table><p>退会したときは、法律で残す必要があるものと、未払いの料金の記録をのぞいて削除します。</p><p>万一に備えて控え（バックアップ）を取っています。退会などで削除した情報も、控えの中には最長1年残り、その後自動で消えます。</p><h4>7. 安全管理</h4><ul><li>個人情報を見られるのは運営者だけにします。</li><li>APIキーなどの鍵は、アプリの画面やプログラムの公開部分には書かず、別の場所に保管します。</li><li>公開欄やチャットに電話番号・メール・URLが書かれた場合は、送信前に止めます。</li><li>カード番号はまち頼では持たず、Stripeが管理します。</li><li>万一、情報が漏れたおそれがあるときは、本人と個人情報保護委員会に知らせます。</li></ul><h4>8. 開示・訂正・削除のご請求とお問い合わせ</h4><p>自分の情報を見たい・直したい・消したい・使うのを止めてほしいときは、アプリ内の「お問い合わせ」か、メール（softkeys33@gmail.com）で連絡してください。本人であることを確認したうえで対応します。</p><h4>9. 改定</h4><p>この方針を変えるときは、アプリ内でお知らせします。</p>";

    '<label>追加の金額（税込） <em class="rq">必須</em><input type="number" id="c1" inputmode="numeric" placeholder="例：4400"></label><label>理由・追加する作業 <em class="rq">必須</em><textarea id="c2" rows="3"></textarea></label><div class="sumbox" id="cS"></div><button class="big" type="submit" style="background:#2F6B45">依頼者に申請する</button>',
    function(){var a=+$('c1').value,w=$('c2').value.trim();if(!a||!w)return '金額と理由を入れてください';proCard('chg',{ad:a,why:w});});
  var sm=function(){$('cS').innerHTML='<div><span>承諾されると</span><b>'+(cur+(+$('c1').value||0)).toLocaleString()+'円</b></div>';};$('c1').oninput=sm;sm();}
/* 完了報告 */
function repForm(){var cur=Number(PC2.bid.amount)||0;
  formPane('完了報告','<label>作業日 <em class="rq">必須</em><input type="date" id="r1" value="'+ymd(new Date())+'"></label><label>作業内容 <em class="rq">必須</em><textarea id="r2" rows="2"></textarea></label>'+
    '<div class="amtbox"><span>承諾済みの金額（税込）</span><b>'+cur.toLocaleString()+'円</b></div><label class="ckl"><input type="checkbox" id="rDn"> 減額がある（作業の一部をやめた など）</label><div id="rDnW" hidden class="subf"><label>減額後の金額（税込）<input type="number" id="rDnA" inputmode="numeric"></label></div>'+
    '<label>施工後の写真 <em class="op">任意</em><input type="file" accept="image/*" multiple></label><button class="big" type="submit" style="background:#2F6B45">この内容で完了報告を送る</button>',
    function(){var w=$('r2').value.trim();if(!w)return '作業内容を入れてください';var amt=cur;if($('rDn').checked){amt=+$('rDnA').value;if(!amt||amt>=cur)return '減額後の金額は、承諾済みの金額より小さくしてください';}
      openSheet('<h3>完了報告を送りますか？</h3><p class="sp s2">依頼者に届きます。依頼者が確認するまでは取り消せます。</p><div class="pc-b"><button type="button" class="g" id="rcN">もどる</button><button type="button" id="rcY">送る</button></div>');
      $('rcN').onclick=closeSheet;$('rcY').onclick=function(){closeSheet();proCard('rep',{day:mdW($('r1').value),what:w,amt:amt},function(){pPop(PC2.bid.id,6);});};});
  $('rDn').onchange=function(){$('rDnW').hidden=!this.checked;};}

/* ===== テストを最初からやり直す ===== */
function testReset(){openSheet('<h3>テストを最初からやり直しますか？</h3><p class="sp s2">あなたの依頼・チャット・お知らせ・AIとの会話を、すべて消します。もとに戻せません。</p><button type="button" class="big" id="trY" style="background:#C8321F">消して、最初からやり直す</button>');
  $('trY').onclick=function(){this.disabled=true;this.textContent='消しています…';api('testReset').then(function(){try{Object.keys(localStorage).forEach(function(k){if(k.indexOf('mph_')===0)localStorage.removeItem(k);});}catch(e){}closeSheet();toast('最初の状態に戻しました');jobSub='new';setMode('user');}).catch(fail);};}

boot();
})();
</script>
