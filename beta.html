供することがあります。</p><ul><li>法律にもとづく場合（警察・裁判所などからの正式な求め）</li><li>人の命・体・財産を守るために必要で、本人の同意を得るのが難しい場合</li></ul><h4>5. 使っている外部サービスと外国への移転</h4><table><tr><th>サービス</th><th>使いみち</th><th>置き場所</th></tr><tr><td>Google（スプレッドシート・ドライブ・Apps Script）</td><td>データの保管、アプリの処理</td><td>日本国外を含む（場所は選べません）</td></tr><tr><td>LINE</td><td>ログイン、通知</td><td>日本など</td></tr><tr><td>OpenAI</td><td>AIの相談への返答</td><td>アメリカ</td></tr><tr><td>Stripe</td><td>カード決済</td><td>アメリカなど</td></tr><tr><td>GitHub</td><td>アプリの画面の公開（個人情報は置きません）</td><td>アメリカ</td></tr></table><ul><li>AIに送る前に、電話番号・メールアドレス・番地などは「XX」に置き換えます。</li><li>OpenAIは、APIで送られた内容をAIの学習に使わない方針です。</li></ul><h4>6. 保管期間と削除</h4><table><tr><th>情報</th><th>保管期間</th></tr><tr><td>本人確認書類の画像</td><td>確認が終わったら削除（確認した結果だけを残します）</td></tr><tr><td>チャット・依頼の記録</td><td>依頼が終わってから5年</td></tr><tr><td>お支払いの記録</td><td>法律で決められた期間</td></tr><tr><td>その他の登録情報</td><td>退会するまで</td></tr></table><p>退会したときは、法律で残す必要があるものと、未払いの料金の記録をのぞいて削除します。</p><p>万一に備えて控え（バックアップ）を取っています。退会などで削除した情報も、控えの中には最長1年残り、その後自動で消えます。</p><h4>7. 安全管理</h4><ul><li>個人情報を見られるのは運営者だけにします。</li><li>APIキーなどの鍵は、アプリの画面やプログラムの公開部分には書かず、別の場所に保管します。</li><li>公開欄やチャットに電話番号・メール・URLが書かれた場合は、送信前に止めます。</li><li>カード番号はまち頼では持たず、Stripeが管理します。</li><li>万一、情報が漏れたおそれがあるときは、本人と個人情報保護委員会に知らせます。</li></ul><h4>8. 開示・訂正・削除のご請求とお問い合わせ</h4><p>自分の情報を見たい・直したい・消したい・使うのを止めてほしいときは、アプリ内の「お問い合わせ」か、メール（softkeys33@gmail.com）で連絡してください。本人であることを確認したうえで対応します。</p><h4>9. 改定</h4><p>この方針を変えるときは、アプリ内でお知らせします。</p>";

function mOpenDM(uid,back){setPane('<div class="ph2"><button type="button" class="bk" aria-label="もどる">‹</button><div class="pt"><b>読み込み中…</b></div></div><div class="msgs" id="mdl"></div>',back);
  api('mDM',{with:uid}).then(function(j){MD=j;MD.back=back;
    setPane('<div class="ph2"><button type="button" class="bk" aria-label="もどる">‹</button><div class="pt"><b>'+esc(j.name)+'</b><span>1対1のチャット</span></div></div><div class="msgs" id="mdl"></div>'+(MW?'<form class="cmp" id="mdf"><label class="ic" aria-label="画像を追加">画像<input type="file" accept="image/*" id="mdi" hidden></label><input id="mdt" placeholder="メッセージを書く" autocomplete="off" aria-label="メッセージ"><button class="sd">送信</button></form>':'<div class="lock">資格の書類の審査が済むと、メッセージを送れます</div>'),back);
    mDMPaint();chatT=setInterval(function(){if(!MD||document.visibilityState!=='visible')return;var l=MD.msgs[MD.msgs.length-1];api('mDM',{with:MD.with,since:l?l.createdAt:''}).then(function(k){if(k.msgs.length){MD.msgs=MD.msgs.concat(k.msgs);mDMPaint();}}).catch(function(){});},8000);
    var sd=function(d){var l=MD.msgs[MD.msgs.length-1];d.with=MD.with;d.since=l?l.createdAt:'';api('mDMSend',d).then(function(k){MD.msgs=MD.msgs.concat(k.msgs);mDMPaint();}).catch(fail);};
    if(!MW)return;
    $('mdf').onsubmit=function(e){e.preventDefault();var t=$('mdt').value.trim();if(!t)return;$('mdt').value='';sd({text:t});};
    $('mdi').onchange=function(e){var f=e.target.files[0];e.target.value='';if(!f)return;toast('写真を送っています…');shrink(f).then(function(u){return api('uploadPhoto',{dataUrl:u});}).then(function(k){sd({img:k.url,text:''});}).catch(fail);};
  }).catch(function(e){fail(e);closePane();});}
function mDMPaint(){var box=$('mdl');if(!box)return;box.innerHTML=MD.msgs.length?MD.msgs.map(function(m){return '<div class="mg'+(m.from===MD.me?' me':'')+'"><span class="wn">'+mdhm(m.createdAt)+'</span><div class="bb">'+(m.img?'<img src="'+esc(m.img)+'" alt="">':'')+esc(m.text||'')+'</div></div>';}).join(''):'<p class="empty">まだメッセージはありません</p>';box.scrollTop=box.scrollHeight;}

boot();
})();
</script>
</body>
</html>
